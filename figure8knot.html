<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTF Visualization: The Figure-Eight Knot (4_1)</title>
    <style>
        body { margin: 0; font-family: 'Times New Roman', serif; background-color: #000; }
        #container { width: 100vw; height: 100vh; display: block; }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 100;
            display:block;
            color: #fff;
            font-size: 20px;
            text-shadow: 0px 0px 5px #000;
        }
    </style>
</head>
<body>
    <div id="info">The Figure-Eight Knot (4_1): The Minimal Volume Hyperbolic Manifold</div>
    <div id="container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // Define the Figure-Eight Knot parametric curve
        // This parameterization is mathematically standard for the 4_1 knot.
        class FigureEightKnot extends THREE.Curve {
            constructor(scale = 1) {
                super();
                this.scale = scale;
            }

            getPoint(t, optionalTarget = new THREE.Vector3()) {
                const point = optionalTarget;
                // t ranges from 0 to 1. Map it to the parameter range 0 to 2*PI.
                const tau = 2 * Math.PI * t;

                // Parametric equations for the Figure-Eight Knot
                const r = 2 + Math.cos(2 * tau);
                const x = r * Math.cos(3 * tau);
                const y = r * Math.sin(3 * tau);
                const z = Math.sin(4 * tau) * 0.8; // Slightly flatten Z for better visualization

                return point.set(x, y, z).multiplyScalar(this.scale);
            }
        }

        let scene, camera, renderer, controls, knot;

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            
            // Camera setup
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 8);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lighting
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(1, 1, 2).normalize();
            scene.add(directionalLight);
            const ambientLight = new THREE.AmbientLight(0x404040, 1.0);
            scene.add(ambientLight);

            // Create the Knot
            const path = new FigureEightKnot(1.0);
            // High resolution geometry: path, tubularSegments, radius, radialSegments, closed
            const geometry = new THREE.TubeGeometry(path, 512, 0.15, 32, true);
            
            // Material
            const material = new THREE.MeshPhongMaterial({
                color: 0x4488ff,
                shininess: 100,
                specular: 0x555555
            });
            
            knot = new THREE.Mesh(geometry, material);
            scene.add(knot);

            // Handle window resize
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            // Slow auto-rotation
            knot.rotation.x += 0.001;
            knot.rotation.y += 0.002;
            
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
